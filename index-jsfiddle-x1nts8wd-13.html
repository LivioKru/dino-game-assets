<!DOCTYPE html>
<html>

<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JSFiddle nmg3zkvt</title>

  <style>
    #score {
  text-align: center;
  font-family: Arial, sans-serif;
}

#controls {
  width: 900px;
  margin: 15px auto 10px auto;
  text-align: center;
}

#startButton {
  padding: 10px 20px;
  font-size: 18px;
  font-family: Arial, sans-serif;
  cursor: pointer;
  border: 2px solid black;
  background-color: white;
  border-radius: 8px;
}

#game {
  width: 900px;
  height: 350px;
  border: 2px solid black;
  margin: auto;
  overflow: hidden;
  position: relative;
  background-image: url("https://raw.githubusercontent.com/LivioKru/dino-game-assets/main/garage.png");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
}

#character {
  width: 120px;
  height: 120px;
  position: absolute;
  left: 40px;
  top: 210px;
  background-image: url("https://raw.githubusercontent.com/LivioKru/dino-game-assets/main/timgioh.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
}

#obstacle {
  width: 170px;
  height: 80px;
  position: absolute;
  left: 900px;
  top: 245px;
  background-image: url("https://raw.githubusercontent.com/LivioKru/dino-game-assets/main/lambo.png");
  background-size: contain;
  background-repeat: no-repeat;
  background-position: center;
  animation: none;
}

@keyframes obstacleMove {
  0% {
    left: 900px;
  }
  100% {
    left: -220px;
  }
}

.jump-animation {
  animation: jump 0.9s ease-out;
}

/* Verbesserung:
   Das Springen ist kürzer und natürlicher als vorher.
   Die Figur bleibt nicht mehr so lange oben
   und kommt schneller wieder runter. */
@keyframes jump {
  0% {
    top: 210px;
  }
  20% {
    top: 150px;
  }
  40% {
    top: 90px;
  }
  60% {
    top: 90px;
  }
  80% {
    top: 150px;
  }
  100% {
    top: 210px;
  }
}

.crash-animation {
  animation: crash 0.45s linear 2;
}

@keyframes crash {
  0% {
    transform: translateX(0) rotate(0deg);
    opacity: 1;
  }
  25% {
    transform: translateX(-10px) rotate(-8deg);
  }
  50% {
    transform: translateX(10px) rotate(8deg);
    opacity: 0.7;
  }
  75% {
    transform: translateX(-6px) rotate(-4deg);
  }
  100% {
    transform: translateX(0) rotate(0deg);
    opacity: 1;
  }
}

#gameOverText,
#startText {
  position: absolute;
  left: 0;
  width: 100%;
  text-align: center;
  font-family: "Courier New", monospace;
  font-weight: 900;
  letter-spacing: 2px;
  text-shadow: 3px 3px 0 #000;
  user-select: none;
  z-index: 10;
}



#gameOverText {
  top: 90px;
  font-size: 48px;
  color: white;
  display: none;
}
  </style>

  
</head>
<body>
  <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TimGioh Game</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="game">
    <div id="character"></div>
    <div id="obstacle"></div>
    <div id="gameOverText">TIMGIOH CRASHED</div>
    <div id="startText">PRESS START OR SPACE</div>
  </div>

  <div id="controls">
    <button id="startButton">Start Game</button>
  </div>

  <h1 id="score">0</h1>

  <script src="script.js"></script>
</body>
</html>

  <script>
    const character = document.getElementById("character");
const obstacle = document.getElementById("obstacle");
const score = document.getElementById("score");
const gameOverText = document.getElementById("gameOverText");
const startText = document.getElementById("startText");
const startButton = document.getElementById("startButton");

score.innerText = 0;

let gameStarted = false;
let gameLoop = null;
let scoreInterval = null;

// Game startet am Anfang nicht
obstacle.style.animation = "none";

function startGame() {
  if (gameStarted) return;

  gameStarted = true;

  score.innerText = 0;
  gameOverText.style.display = "none";
  startText.style.display = "none";

  character.classList.remove("crash-animation");
  character.style.top = "210px";

  obstacle.style.animation = "none";
  obstacle.style.left = "900px";

  setTimeout(() => {
    obstacle.style.animation = "obstacleMove 2s infinite linear";
  }, 50);

  scoreInterval = setInterval(() => {
    score.innerText = Number(score.innerText) + 1;
  }, 100);

  gameLoop = setInterval(() => {
    const characterTop = parseInt(
      window.getComputedStyle(character).getPropertyValue("top")
    );

    const obstacleLeft = parseInt(
      window.getComputedStyle(obstacle).getPropertyValue("left")
    );

    // Kollisionsbereich angepasst auf den Lamborghini
    if (obstacleLeft < 150 && obstacleLeft > 20 && characterTop > 170) {
      endGame(obstacleLeft);
    }
  }, 20);
}

function endGame(obstacleLeft) {
  obstacle.style.animation = "none";
  obstacle.style.left = obstacleLeft + "px";

  clearInterval(gameLoop);
  clearInterval(scoreInterval);

  gameLoop = null;
  scoreInterval = null;
  gameStarted = false;

  gameOverText.style.display = "block";
  startText.style.display = "block";
  startText.innerText = "PRESS START OR SPACE TO RESTART";

  character.classList.add("crash-animation");

  setTimeout(() => {
    character.classList.remove("crash-animation");
    obstacle.style.left = "900px";
  }, 700);
}

function jump() {
  if (!gameStarted) return;

  if (!character.classList.contains("jump-animation")) {
    character.classList.add("jump-animation");

    setTimeout(() => {
      character.classList.remove("jump-animation");
    }, 900);
  }
}

startButton.addEventListener("click", () => {
  console.log("Start button was clicked");
  startGame();
});

document.addEventListener("keydown", (e) => {
  if (e.code === "Space") {
    e.preventDefault();

    if (!gameStarted) {
      startGame();
    } else {
      jump();
    }
  }
});
  </script>
</body>
</html>
